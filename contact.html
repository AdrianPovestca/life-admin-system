<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Punctlife</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #FBF8F3; color: #1C1917; line-height: 1.65;
    margin: 0; padding: 0;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 80px 24px; }
  a.back { color: #C65D3B; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
  a.back:hover { text-decoration: underline; }
  h1 { font-size: 2rem; margin: 32px 0 12px; letter-spacing: -0.02em; }
  p.sub { color: #57534E; margin-bottom: 32px; }
  
  .field { margin-bottom: 20px; }
  label { display: block; font-weight: 600; font-size: 0.95rem; margin-bottom: 6px; }
  input, textarea {
    width: 100%; padding: 12px 14px; border: 1px solid #E7E2D9;
    border-radius: 10px; font-family: inherit; font-size: 1rem;
    background: #FFFFFF; color: #1C1917; box-sizing: border-box;
  }
  input:focus, textarea:focus { outline: 2px solid #C65D3B; border-color: transparent; }
  textarea { resize: vertical; min-height: 140px; }
  button {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 14px 26px; border-radius: 12px; font-weight: 600; font-size: 1rem;
    background: #1C1917; color: #FBF8F3; border: none; cursor: pointer;
    font-family: inherit; transition: background 0.15s; width: 100%;
  }
  button:hover { background: #C65D3B; }

  .direct-email {
    margin-top: 40px; text-align: center; padding-top: 24px;
    border-top: 1px solid #E7E2D9; color: #57534E; font-size: 0.95rem;
  }
  .direct-email a { color: #C65D3B; font-weight: 600; text-decoration: none; }
  .direct-email a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Back to homepage</a>
    <h1>Get in touch</h1>
    <p class="sub">Questions about the system, refunds, or anything else? I read every message myself.</p>

    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <div class="field">
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" required placeholder="John Doe">
      </div>
      <div class="field">
        <label for="email">Your email</label>
        <input type="email" id="email" name="email" required placeholder="john@example.com">
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="How can I help you?"></textarea>
      </div>
      <button type="submit">Send message</button>
    </form>

    <div class="direct-email">
      Or email me directly at <a href="mailto:contact_p_life@proton.me">contact_p_life@proton.me</a>
    </div>
  </div>
</body>
</html>
